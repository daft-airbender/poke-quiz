<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#388f8f" />
    <title>Poké Quiz</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Re-apply this device's saved Pokémon theme before the first paint (public/theme.js saves it).
      try {
        var theme = JSON.parse(localStorage.getItem('theme'));
        var tokens = theme && theme[matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'];
        for (var name in tokens) document.documentElement.style.setProperty(name, tokens[name]);
        if (tokens) document.querySelector('meta[name="theme-color"]').setAttribute('content', tokens['--accent']);
      } catch (e) {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact/dist/preact.mjs",
          "preact/hooks": "/vendor/preact/hooks/dist/hooks.mjs",
          "htm": "/vendor/htm/dist/htm.module.js",
          "htm/preact": "/vendor/htm/preact/index.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
